name: Build tabby-uac

on:
  push:
    paths:
      - 'tabby-uac/**'
      - '.github/workflows/build-uac.yml'
    branches:
    - '**'
  pull_request:
    paths:
      - 'tabby-uac/**'
      - '.github/workflows/build-uac.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build UAC (Release x64)
        run: msbuild tabby-uac/UAC.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformTarget=x64

      - name: Copy EXE to extras
        run: |
          Copy-Item -Path "tabby-uac/x64/Release/UAC.exe" -Destination "extras/UAC.exe" -Force
        shell: pwsh

      - name: Commit and push UAC.exe
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add extras/UAC.exe
          
          # Check if there are changes to commit
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "chore(UAC): build UAC.exe from tabby-uac"
            git push
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
